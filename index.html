<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131820"><meta name="description" content="Find your way back in Port Lucero, a Caribbean port where everyone has a life of their own.">
<title>Back on the Block | Port Lucero</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="game-shell">
  <canvas id="world" tabindex="-1" aria-label="Port Lucero. Walk with WASD or arrow keys. E interacts."></canvas>
  <section id="hud" hidden aria-label="Player status">
    <div class="money" id="money">$85</div>
    <div class="health-readout"><span aria-hidden="true">+</span><progress id="health" max="100" value="100" aria-label="Health"></progress><strong id="health-text">100</strong></div>
    <span id="vehicle-status"></span>
    <div id="vehicle-vitals" hidden aria-label="Vehicle instruments">
      <div class="meter-row"><label for="car-condition">Condition</label><strong id="car-condition-text">100%</strong><progress id="car-condition" max="100" value="100"></progress></div>
      <div class="meter-row"><label for="car-fuel">Fuel</label><strong id="car-fuel-text">100%</strong><progress id="car-fuel" max="100" value="100"></progress></div>
      <span id="car-warning" hidden></span>
    </div>
    <div id="medical-status" hidden>
      <div role="status"><strong id="injury-label"></strong><span id="care-progress"></span></div>
      <button id="call-ambulance"><kbd>C</kbd> Call ambulance</button>
    </div>
    <button id="pause-button" class="icon-button" aria-label="Pause game">Ⅱ</button>
  </section>
  <section id="legal" data-stage="clear" hidden aria-label="Time and police status">
    <div class="dispatch-top"><span id="day-label">DAY 01</span><strong id="clock">08:00</strong></div>
    <div class="dispatch-strip" aria-hidden="true"><i></i></div>
    <div class="dispatch-bottom"><span id="case-status">Clear</span><span id="dispatch-timer"></span></div>
  </section>
  <aside id="objective" hidden><span class="eyebrow" id="chapter"></span><p id="objective-text"></p><span id="waypoint-text"></span></aside>
  <button id="minimap-button" hidden aria-label="Open town map">
    <span class="radar"><canvas id="minimap" width="184" height="184" aria-hidden="true"></canvas><i aria-hidden="true">N</i></span>
    <strong id="location"></strong>
  </button>
  <button id="prompt" hidden><kbd>E</kbd><span id="prompt-text"></span></button>
  <section id="street-actions" hidden aria-label="Nearby actions">
    <header><strong id="street-heading"></strong><button id="end-interaction" aria-label="End interaction">×</button></header>
    <p id="street-detail"></p>
    <div id="street-options"></div>
    <button id="more-options" hidden></button>
  </section>
  <div id="subtitles" role="log" aria-live="polite" aria-relevant="additions"></div>
  <nav id="toolbar" hidden aria-label="Notebook and save"><button data-panel="bag">Bag <kbd>I</kbd></button><button data-panel="people">Contacts <kbd>N</kbd></button><button data-panel="journal">Journal <kbd>L</kbd></button><button id="save-button">Save</button></nav>
  <div id="control-hints" hidden><kbd>WASD</kbd> Move <kbd>Shift</kbd> Run <kbd>E</kbd> Interact</div>
  <div id="notifications" aria-live="polite" aria-atomic="false"></div>
  <div id="title-screen" class="screen">
    <section class="title-copy">
      <h1 aria-label="Back on the Block"><span>Back on</span><span>the Block</span></h1>
      <nav id="main-menu" aria-label="Main menu">
        <button id="continue-button" hidden>Continue</button>
        <button id="new-game">New game</button>
        <button id="settings-button">Settings</button>
        <button id="credits-button">Controls &amp; credits</button>
      </nav>
    </section>
    <div class="title-location"><span>Port Lucero</span><small>Northern Caribbean</small></div>
    <div class="title-footer" aria-hidden="true"><span><kbd>↑</kbd> <kbd>↓</kbd> Navigate</span><span><kbd>↵</kbd> Select</span></div>
  </div>
  <section id="modal" class="modal-shade" hidden aria-label="Game panel"><article id="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header><div><span id="modal-kicker" class="eyebrow"></span><h2 id="modal-title"></h2></div><button id="close-modal" class="icon-button" aria-label="Close panel">×</button></header><div id="modal-content"></div><footer id="modal-actions"></footer></article></section>
  <div id="touch-controls" hidden>
    <div class="direction-pad" role="group" aria-label="Movement">
      <button data-touch="w" aria-label="Move up or accelerate">↑</button>
      <button data-touch="a" aria-label="Move left or steer left">←</button>
      <button data-touch="s" aria-label="Move down or reverse">↓</button>
      <button data-touch="d" aria-label="Move right or steer right">→</button>
    </div>
    <div class="touch-actions" role="group" aria-label="Street actions">
      <button data-tap="e">Use</button><button data-touch="shift" id="touch-pace">Run</button>
      <button data-tap="h">Heal</button><button data-tap="r" id="touch-extra" hidden>Reload</button>
    </div>
  </div>
  <input type="file" id="import-save" accept="application/json,.json" hidden>
  <input type="file" id="import-music" accept="audio/*" hidden>
</main>
<script type="module" src="src/app.js"></script>
</body>
</html>
